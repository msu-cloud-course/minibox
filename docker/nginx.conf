# nginx for MiniBox in Docker: serves public/ and passes PHP requests to the "app" container.
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # nginx accepts bodies up to 32 MB. PHP itself stops at 14 MB and the app at 10 MB,
    # so files between 10 and 32 MB get a normal error message from the app.
    client_max_body_size 32M;

    # Anything bigger is rejected by nginx with this page.
    error_page 413 /too-large.html;
    location = /too-large.html {
        internal;
    }

    location / {
        # Existing files (css) are served directly, everything else goes to index.php.
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        # The path of index.php inside the "app" container.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    # Any other .php file is not a page.
    location ~ \.php$ {
        return 404;
    }
}
