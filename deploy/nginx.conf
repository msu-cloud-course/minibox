# nginx site for MiniBox with PHP-FPM (Ubuntu).
# Copy to /etc/nginx/sites-available/minibox and enable it (see README.md).
server {
    listen 80;
    server_name _;

    # Only public/ is served. src/, views/, storage/ and .env stay private.
    root /var/www/minibox/public;
    index index.php;

    # nginx accepts bodies up to 32 MB. PHP stops at 14 MB and the app at 10 MB,
    # so files between 10 and 32 MB get a normal error message from the app.
    client_max_body_size 32M;

    # Anything bigger is rejected by nginx with this page.
    error_page 413 /too-large.html;
    location = /too-large.html {
        internal;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Any other .php file is not a page.
    location ~ \.php$ {
        return 404;
    }
}
